<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول - معرض البحري</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar ثابت -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">🚗 معرض البحري للسيارات</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link active" href="asaaa.html">تسجيل الدخول</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html"> تواصل معنا</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div style="height: 70px;"></div>


  <!-- نموذج تسجيل الدخول -->
  <div class="container d-flex justify-content-center align-items-start" style="min-height: calc(100vh - 120px);">
    <div class="card shadow-sm p-4 mt-4" style="max-width: 420px; width: 100%;">
      <h3 class="text-center mb-3">تسجيل الدخول</h3>
      <form id="loginForm" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="example@mail.com" required>
          <div class="invalid-feedback">الرجاء إدخال بريد إلكتروني صحيح.</div>
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">كلمة المرور</label>
          <input type="password" class="form-control" id="loginPassword" minlength="6" placeholder="******" required>
          <div class="invalid-feedback">كلمة المرور يجب أن تكون 6 أحرف على الأقل.</div>
        </div>
        <button type="submit" class="btn btn-dark w-100">تسجيل الدخول</button>
        <a href="abooood.html" style="text-align:center;  text-decoration: none;"> انشاء حساب </a>
      </form>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
    <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="successMessage">تم تسجيل الدخول بنجاح!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="إغلاق"></button>
      </div>
    </div>
    <div id="errorToast" class="toast align-items-center text-bg-danger border-0 mt-2" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="errorMessage">البريد أو كلمة المرور غير صحيحة!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="إغلاق"></button>
      </div>
    </div>
  </div>

  <!-- jQuery + Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS التحقق وToast -->
  <script>
  $(function () {
    $('#loginForm').on('submit', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const formEl = this;

      if (!formEl.checkValidity()) {
        formEl.classList.add('was-validated');
        return;
      }

      const email = $('#loginEmail').val();
      const password = $('#loginPassword').val();

      if(email === "test@test.com" && password === "123456") {
        const successToast = new bootstrap.Toast($('#successToast')[0]);
        $('#successMessage').text('✅ تم تسجيل الدخول بنجاح!');
        successToast.show();

        setTimeout(() => window.location.href = 'index.html', 1200);
      } else {
        const errorToast = new bootstrap.Toast($('#errorToast')[0]);
        $('#errorMessage').text('❌ البريد أو كلمة المرور غير صحيحة!');
        errorToast.show();
      }
    });
  });
  </script>

</body>
</html>
